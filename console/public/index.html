<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migration Lab Console</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="lab-name">Migration Lab</span>
    <span class="product">MongoDB to Oracle AI Database 26ai</span>
  </div>
  <div class="ready" id="ready" aria-live="polite"></div>
  <button type="button" class="btn ghost" id="theme" aria-label="Switch light or dark theme">Dark</button>
</header>

<nav class="demos" id="demos" role="tablist" aria-label="Demos"></nav>

<section class="demo-head">
  <h1 id="demo-title">Loading the demos</h1>
  <span class="banner" id="banner" hidden></span>
  <button type="button" class="btn" id="reset">Reset demo</button>
</section>

<div class="body">
  <ol class="steps" id="steps" aria-label="Steps"></ol>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>

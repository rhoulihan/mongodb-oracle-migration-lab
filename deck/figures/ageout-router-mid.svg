<svg width="1120" height="420" class="fig" viewBox="0 0 1120 420" role="img" aria-label="Age out, later: old orders age out of MongoDB under the retention policy, so the MongoDB archive shrinks while Oracle grows" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs><marker id="dk8c29e73-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker><marker id="dk8c29e73-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect data-id="ar-f22f73" x="18.0" y="128.0" width="270.0" height="112.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect data-id="ar-b48d65" x="18.0" y="128.0" width="4" height="112.0" rx="2" fill="var(--ink)"/><text data-id="ar-98b5ab" x="155.0" y="166.1" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Order service</text><text data-id="ar-a2cb82" x="155.0" y="190.5" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">router: by placedAt</text><text data-id="ar-08862f" x="155.0" y="214.8" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">vs. the cutoff</text><g data-id="ar-602201" class="overlay-twin"><rect data-id="ar-5c78f9" x="430.0" y="54.0" width="620.0" height="104.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.8"/></g><text data-id="ar-226f12" x="450.0" y="92.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">Oracle AI Database 26ai</text><text data-id="ar-a5382a" x="450.0" y="118.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">new orders from day N</text><text data-id="ar-45be19" x="450.0" y="140.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">+ subscribers, accounts, catalog</text><path data-id="ar-33a57b" d="M288,170 H360 V106 H428" fill="none" stroke="var(--cool)" stroke-width="2" stroke-linejoin="round" marker-end="url(#dk8c29e73-varcool)"/><path data-id="ar-945f26" d="M288,198 H360 V282 H428" fill="none" stroke="var(--flow)" stroke-width="2" stroke-linejoin="round" marker-end="url(#dk8c29e73-varflow)" stroke-dasharray="6 4"/><g data-id="ar-602201-1" class="overlay-twin"><rect data-id="ar-1585e8" x="430.0" y="230.0" width="300.0" height="104.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><text data-id="ar-e9e26b" x="450.0" y="268.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="start">MongoDB archive</text><text data-id="ar-035471" x="450.0" y="294.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">older orders, shrinking</text><line data-id="ar-34e851" x1="120.0" y1="384.0" x2="1000.0" y2="384.0" stroke="var(--hairline)" stroke-width="3"/><circle data-id="ar-11b6e0" cx="120.0" cy="384.0" r="7"
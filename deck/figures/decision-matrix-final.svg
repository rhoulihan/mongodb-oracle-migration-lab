everse sync</text><text x="531.0" y="337.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">weeks</text><text x="661.0" y="327.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">highest:</text><text x="661.0" y="347.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">replicator</text><text x="791.0" y="327.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">during, behind</text><text x="791.0" y="347.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">blue&#x27;s shape</text><text x="870.0" y="310.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--ink)" text-anchor="start">1  oplog window too short</text><text x="870.0" y="335.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--ink)" text-anchor="start">2  split brain at the flip</text><text x="870.0" y="360.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--ink)" text-anchor="start">3  lag freezes writes</text></svg>

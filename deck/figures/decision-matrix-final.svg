<svg width="1120" height="400" class="fig" viewBox="0 0 1120 400" role="img" aria-label="The decision matrix, filled in. Age out: near-zero downtime, a partial way back since the old side stays, months to years, two systems to run, the best fit for optimization; risks are the seams across the cutoff, an archive nobody retires, two stacks. Dump and restore: a planned window, a free way back until writes open, one window, the lowest ops load, lift first and remodel later; risks are a window overrun, quiet type drift, no free way back later. Blue/green: near-zero downtime, a reverse sync, weeks, the highest ops load, optimize during the move behind blue&#x27;s shape; risks are a short oplog window, split brain at the flip, lag that freezes writes" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="271.0" y="38.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="middle">DOWNTIME</text><text x="401.0" y="38.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="middle">WAY BACK</text><text x="531.0" y="38.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="middle">HOW LONG</text><text x="661.0" y="38.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="middle">OPS LOAD</text><text x="791.0" y=
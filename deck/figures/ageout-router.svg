<svg width="1120" height="420" class="fig" viewBox="0 0 1120 420" role="img" aria-label="Age out, day N: the order service routes reads by the cutoff. New orders and the moved entity data are on Oracle; every older order stays in MongoDB, read only" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs><marker id="dk2f11991-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker><marker id="dk2f11991-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect data-id="ar-f22f73" x="18.0" y="128.0" width="270.0" height="112.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect data-id="ar-b48d65" x="18.0" y="128.0" width="4" height="112.0" rx="2" fill="var(--ink)"/><text data-id="ar-98b5ab" x="155.0" y="166.1" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Order service</text><text data-id="ar-a2cb82" x="155.0" y="190.5" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">router: by placedAt</text><text data-id="ar-08862f" x="155.0" y="214.8" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-se
ine data-id="ar-c887b9" x1="460.0" y1="312.0" x2="460.0" y2="307.0" stroke="var(--hot)" stroke-width="2"/><line data-id="ar-5b3255" x1="460.0" y1="312.0" x2="464.0" y2="312.0" stroke="var(--hot)" stroke-width="2"/><text data-id="ar-b74dd3" x="476.0" y="316.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--hot)" text-anchor="start">carts and events expire here</text><line data-id="ar-34e851" x1="120.0" y1="384.0" x2="1000.0" y2="384.0" stroke="var(--hairline)" stroke-width="3"/><circle data-id="ar-11b6e0" cx="120.0" cy="384.0" r="7" fill="var(--ink)" stroke="none" stroke-width="0"/><text data-id="ar-934124" x="112.0" y="368.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Day N: cutoff</text><circle data-id="ar-10879e" cx="560.0" cy="384.0" r="7" fill="var(--hairline)" stroke="none" stroke-width="0"/><text data-id="ar-12533a" x="560.0" y="368.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--faint)" text-anchor="middle">Old orders age out</text><circle data-id="ar-f9a4fb" cx="1000.0" cy="384.0" r="7" fill="var(--hairline)" stroke="none" stroke-width="0"/><text data-id="ar-deb9e1" x="1008.0" y="368.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--faint)" text-anchor="end">Retention passes: switch it off</text><g data-id="ar-602201-2" class="overlay-twin"><circle data-id="ar-e7eb37" cx="120.0" cy="384.0" r="11.0" fill="none" stroke="var(--hot)" stroke-width="2.4"/></g></svg>

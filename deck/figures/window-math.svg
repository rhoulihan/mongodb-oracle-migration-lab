<svg width="1120" height="400" class="fig" viewBox="0 0 1120 400" role="img" aria-label="The maintenance window as a stacked timeline: stop writes, dump, restore, rebuild or verify indexes, validate, then a rollback buffer. The go or no-go call comes after validation. The whole window is sized from a rehearsal" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">STEP</text><text x="300.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">TIME IN THE WINDOW (ILLUSTRATIVE)</text><text x="18.0" y="79.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Stop writes</text><text x="18.0" y="98.0" font-size="13" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">app down or read only</text><g class="fragment custom bar-grow" data-fragment-index="1"><rect x="300.0" y="68.0" width="24.0" height="28.0" rx="5" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.6"/></g><text x="18.0" y="125.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Dump</text><text x="18.0" y="144.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--muted)" text-anchor="start">mongodump --archive --gzip</text><g class="fragment custom bar-grow" data-fragment-index="2"><rect x="324.0" y="114.0" width="150.0" height="28.0" rx="5" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.6"/></g><text x="18.0" y="171.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Restore</text><text x="18.0" y="190.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--muted)" text-anchor="start">mongorestore, in parallel</text><g class="fragment custom bar-grow" data-fragment-index="3"><rect x="474.0" y="160.0" width="236.0" height="28.0" rx="5" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.6"/></g><text x="18.0" y="217.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Indexes</text><text x="18.0" y="236.0" font-size="13" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">rebuild or verify</text><g class="fragment custom bar-grow" data-fragment-index="4"><rect x="710.0" y="206.0" width="104.0" height="28.0" rx="5" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.6"/></g><text x="18.0" y="263.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Validate</text><text x="18.0" y="282.0" font-size="13" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">counts, $type, the app&#x27;s queries</text><g class="fragment custom bar-grow" data-fragment-index="5"><rect x="814.0" y="252.0" width="132.0" height="28.0" rx="5" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.6"/></g><text x="18.0" y="309.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Rollback buffer</text><text x="18.0" y="328.0" font-size="13" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">time to go back</text><g class="fragment custom bar-grow" data-fragment-index="6"><rect x="946.0" y="298.0" width="132.0" height="28.0" rx="5" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.6" stroke-dasharray="6 4"/></g><line x1="946.0" y1="58.0" x2="946.0" y2="294.0" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 4"/><text x="956.0" y="74.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--ink)" text-anchor="start">go / no-go</text><path d="M300,342 V352 H1078 V342" fill="none" stroke="var(--hot)" stroke-width="1.8" stroke-linejoin="round"/><text x="689.0" y="378.0" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="middle">your window</text></svg>

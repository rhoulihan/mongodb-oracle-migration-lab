<svg width="1120" height="400" class="fig" viewBox="0 0 1120 400" role="img" aria-label="Agent B re-reads (ETag E2), swaps the device again and writes: accepted. The order has both changes, 2 updates applied. Without an ETag the write is accepted: last writer wins" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect data-id="et-20a08d" x="18.0" y="46.0" width="290.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--flow)" stroke-width="1.4"/><rect data-id="et-d81976" x="18.0" y="46.0" width="4" height="104.0" rx="2" fill="var(--flow)"/><text data-id="et-f28db5" x="165.0" y="80.1" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Agent A</text><text data-id="et-ada301" x="165.0" y="104.5" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">read the order:</text><text data-id="et-005852" x="165.0" y="128.8" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">ETag E1</text><rect data-id="et-1392ca" x="18.0" y="226.0" width="290.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect data-id="et-e891ca" x="18.0" y="226.0" width="4" height="104.0" rx="2" fill="var(--cool)"/><text data-id="et-33ed6e" x="165.0" y="260.1" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Agent B</text><text data-id="et-9e357e" x="165.0" y="284.5" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">re-read: ETag E2,</text><text data-id="et-9e41cd" x="165.0" y="308.8" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">swapped again</text><g data-id="et-602201" class="overlay-twin"><rect data-id="et-09f6b4" x="470.0" y="70.0" width="230.0" height="56.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><g data-id="et-602201-1" class="overlay-twin"><rect data-id="et-b2d428" x="470.0" y="250.0" width="230.0" height="56.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.8"/></g><text data-id="et-e14724" x="486.0" y="93.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">status: provisioned</text><text data-id="et-764e0f" x="486.0" y="114.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--muted)" text-anchor="start">with ETag E1</text><text data-id="et-357eba" x="486.0" y="273.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">device: phone B</text><text data-id="et-842480" x="486.0" y="294.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--muted)" text-anchor="start">with ETag E2</text><text data-id="et-6aba48" x="478.0" y="150.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="start">accepted</text><text data-id="et-98f1f3" x="478.0" y="330.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="start">accepted: ETag now E3</text><rect data-id="et-549604" x="720.0" y="46.0" width="382.0" height="284.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6"/><text data-id="et-45cb15" x="742.0" y="82.0" font-size="20" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">The order</text><text data-id="et-2994b7" x="742.0" y="106.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">one document, from a duality view</text><text data-id="et-4a2e0b" x="742.0" y="150.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--muted)" text-anchor="start">status:</text><text data-id="et-0e555e" x="840.0" y="150.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--ink)" text-anchor="start">provisioned</text><text data-id="et-8ce341" x="742.0" y="188.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--muted)" text-anchor="start">device:</text><text data-id="et-6e384a" x="840.0" y="188.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--ink)" text-anchor="start">phone B</text><text data-id="et-880d81" x="742.0" y="226.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--muted)" text-anchor="start">etag:</text><text data-id="et-6f9d80" x="840.0" y="226.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--cool)" text-anchor="start">E3</text><text data-id="et-8baa14" x="742.0" y="298.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">updates applied: 2</text><text data-id="et-9466a9" x="560.0" y="376.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="middle">No ETag sent? Oracle accepts it: last writer wins.</text></svg>

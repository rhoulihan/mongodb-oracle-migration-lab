<svg width="1120" height="400" class="fig" viewBox="0 0 1120 400" role="img" aria-label="The cost of age out: two full operational stacks, one for the old data on MongoDB and one for Oracle, each with its own patch cycle, login model, attack surface, backups and on-call runbook, for as long as the old data must stay online and queryable" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="150.0" y="24.0" width="330.0" height="40.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/><text x="315.0" y="50.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="middle">MongoDB, old data</text><rect x="150.0" y="74.0" width="330.0" height="46.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><text x="315.0" y="103.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">Patch cycle</text><rect x="150.0" y="128.0" width="330.0" height="46.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><text x="315.0" y="157.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="
<svg width="1120" height="400" class="fig" viewBox="0 0 1120 400" role="img" aria-label="The cost of age out: two full operational stacks, one for the MongoDB archive and one for Oracle, each with its own patch cycle, login model, attack surface, backups and on-call runbook, for every year of the retention window" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="150.0" y="24.0" width="330.0" height="40.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/><text x="315.0" y="50.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="middle">MongoDB archive</text><rect x="150.0" y="74.0" width="330.0" height="46.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><text x="315.0" y="103.0" font-size="17" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">Patch cycle</text><rect x="150.0" y="128.0" width="330.0" height="46.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><text x="315.0" y="157.0" font-size="17" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">Login model</text><rect x="150.0" y="182.0" width="330.0" height="46.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><text x="315.0" y="211.0" font-size="17" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weig
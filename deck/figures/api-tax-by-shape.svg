<svg width="1120" height="340" class="fig" viewBox="0 0 1120 340" role="img" aria-label="Route by shape. Finds and CRUD ran at parity through the Oracle API for MongoDB in a field proof of concept, so they stay on the API. Aggregation pipelines ran about 3 to 15 times slower through the API, so rewrite the hot ones as $sql and the optimizer gets the whole question" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs><marker id="dkbfd07d4-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker><marker id="dkbfd07d4-varhot" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">THE REQUEST</text><text x="360.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">THROUGH THE API (FIELD POC)</text><text x="790.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">WHAT TO DO</text><rect x="18.0" y="135.0" width="250.0" height="100.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="18.0" y="135.0" width="4" height="100.0" rx="2" fill="var(--ink)"/><text x="145.0" y="168.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Your app</text><text x="145.0" y="191.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same driver,</text><text x="145.0" y="214.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same code</text><rect x="360.0" y="50.0" width="340.0" height="100.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="360.0" y="50.0" width="4" height="100.0" rx="2" fill="var(--cool)"/><text x="532.0" y="94.6" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Finds and CRUD</text><text x="532.0" y="117.6" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">at parity</text><rect x="360.0" y="220.0" width="340.0" height="100.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><rect x="360.0" y="220.0" width="4" height="100.0" rx="2" fill="var(--hot)"/><text x="532.0" y="264.6" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Aggregation pipelines</text><text x="532.0" y="287.6" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">about 3 to 15x slower</text><rect x="790.0" y="50.0" width="312.0" height="100.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="790.0" y="50.0" width="4" height="100.0" rx="2" fill="var(--cool)"/><text x="948.0" y="94.6" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Keep them on the API</text><text x="948.0" y="117.6" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">nothing to change</text><rect x="790.0" y="220.0" width="312.0" height="100.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="790.0" y="220.0" width="4" height="100.0" rx="2" fill="var(--cool)"/><text x="948.0" y="253.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Rewrite the hot ones</text><text x="948.0" y="276.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">as $sql: the optimizer</text><text x="948.0" y="299.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">sees the whole question</text><path d="M268,185 H314" fill="none" stroke="var(--slate)" stroke-width="1.7" stroke-linejoin="round"/><path d="M314,185 V100 H359" fill="none" stroke="var(--cool)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dkbfd07d4-varcool)"/><path d="M314,185 V270 H359" fill="none" stroke="var(--hot)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dkbfd07d4-varhot)"/><path d="M700.0,100.0 H745.0 H789.0" fill="none" stroke="var(--cool)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dkbfd07d4-varcool)"/><path d="M700.0,270.0 H745.0 H789.0" fill="none" stroke="var(--cool)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dkbfd07d4-varcool)"/></svg>

<svg width="1120" height="360" class="fig" viewBox="0 0 1120 360" role="img" aria-label="Keep the database name out of the restore URI. The app&#x27;s connection string ends in /MIG; copied into mongorestore it acts as --db MIG, the dump holds only telco, and the restore finishes with 0 documents and exit code 0. The restore URI ends at the slash, and --nsFrom telco.* --nsTo MIG.* renames every collection into MIG" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs><marker id="dkba144029-varhot" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker><marker id="dkba144029-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">COPIED FROM THE APP&#x27;S CONNECTION STRING</text><rect x="18.0" y="48.0" width="680.0" height="104.0" rx="8" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.6"/><text x="40.0" y="88.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">mongodb://MIG:•••@host:27017</text><rect x="276.1" y="73.3" width="40.2" height="21.0" rx="3" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.2"/><text x="282.1" y="88.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--hot)" text-anchor="start">/MIG</text><text x="319.3" y="88.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">?authMechanism=PLAIN&amp;authSource=$external</text><text x="40.0" y="122.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">right for the app; mongorestore reads it as --db MIG</text><rect x="742.0" y="48.0" width="360.0" height="104.0" rx="8" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.6"/><text x="764.0" y="88.0" font-size="20" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="start">0 document(s) restored</text><text x="764.0" y="112.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="start">exit 0: the job reports green</text><text x="764.0" y="136.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">the dump holds only telco.*</text><line x1="704.0" y1="100.0" x2="736.0" y2="100.0" stroke="var(--hot)" stroke-width="1.8" marker-end="url(#dkba144029-varhot)"/><text x="18.0" y="184.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">WRITTEN FOR THE RESTORE</text><rect x="18.0" y="198.0" width="680.0" height="140.0" rx="8" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/><text x="40.0" y="238.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">mongodb://MIG:•••@host:27017</text><rect x="276.1" y="223.3" width="14.5" height="21.0" rx="3" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.2"/><text x="282.1" y="238.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--cool)" text-anchor="start">/</text><text x="293.7" y="238.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">?authMechanism=PLAIN&amp;authSource=$external</text><text x="40.0" y="270.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--cool)" text-anchor="start">--nsFrom &#x27;telco.*&#x27; --nsTo &#x27;MIG.*&#x27;</text><text x="40.0" y="304.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">the URI ends at the slash; the target goes in the flags</text><rect x="742.0" y="198.0" width="360.0" height="140.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6"/><text x="764.0" y="238.0" font-size="20" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">N document(s) restored</text><text x="764.0" y="280.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">telco.orders → MIG.orders</text><text x="764.0" y="322.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">fail the job when N is 0</text><line x1="704.0" y1="268.0" x2="736.0" y2="268.0" stroke="var(--cool)" stroke-width="1.8" marker-end="url(#dkba144029-varcool)"/></svg>

<svg width="1120" height="360" class="fig" viewBox="0 0 1120 360" role="img" aria-label="One canonical form fans out into three projections (rows on tables, embedded documents, graph edges); queries on an access surface (SQL, the MongoDB API, SQL/PGQ) turn each projection into the shape a consumer reads: a rowset, the order document (a duality view over the rows), a graph result" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs><marker id="dke7870d8-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker><marker id="dke7870d8-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text data-id="cp-39df8b" x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">CANONICAL FORM</text><g data-id="cp-602201" class="overlay-twin"><rect data-id="cp-5938fe" x="420.0" y="52.0" width="280.0" height="80.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><g data-id="cp-602201-1" class="overlay-twin"><rect data-id="cp-a22930" x="420.0" y="150.0"
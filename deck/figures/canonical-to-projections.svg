<svg width="1120" height="360" class="fig" viewBox="0 0 1120 360" role="img" aria-label="One canonical form fans out into three projections (rows on tables, embedded documents, graph edges); queries on an access surface (SQL, the MongoDB API, SQL/PGQ) turn each projection into the shape a consumer reads: a rowset, the order document (a duality view over the rows), a graph result" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs><marker id="dke7870d8-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker><marker id="dke7870d8-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text data-id="cp-39df8b" x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">CANONICAL FORM</text><g data-id="cp-602201" class="overlay-twin"><rect data-id="cp-5938fe" x="420.0" y="52.0" width="280.0" height="80.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><g data-id="cp-602201-1" class="overlay-twin"><rect data-id="cp-a22930" x="420.0" y="150.0" width="280.0" height="80.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><g data-id="cp-602201-2" class="overlay-twin">
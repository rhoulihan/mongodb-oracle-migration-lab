<svg width="1120" height="360" class="fig" viewBox="0 0 1120 360" role="img" aria-label="One canonical form: the telecom domain modeled once, as entities, properties and relationships, before any storage choice" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text data-id="cp-39df8b" x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">CANONICAL FORM</text><g data-id="cp-602201" class="overlay-twin"><rect data-id="cp-e967f1" x="40.0" y="140.0" width="226.0" height="28.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><g data-id="cp-602201-1" class="overlay-twin"><rect data-id="cp-0b2f96" x="40.0" y="174.0" width="226.0" height="28.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><g data-id="cp-602201-2" class="overlay-twin"><rect data-id="cp-6e6e2f" x="40.0" y="208.0" width="226.0" height="28.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/></g><rect data-id="cp-12f5de" x="18.0" y="124.0" width="270.0" height="132.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect data-id="cp-319d3b" x="18.0" y="124.0" width="4" height="132.0" rx="2" fill="var(--cool)"/><text data-id="cp-05be99" x="155.0" y="161.6" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Telecom domain</text><text data-id="cp-c64a87" x="155.0" y="184.6" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">subscriber, order, device:</text><text data-id="cp-1f86b5" x="155.0" y="207.6" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">entities, properties,</text><text data-id="cp-1d52c2" x="155.0" y="230.7" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">relationships</text><text data-id="cp-ec23fd" x="420.0" y="178.0" font-size="24" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="start">Model the business once:</text><text data-id="cp-2fc501" x="420.0" y="212.0" font-size="20" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">what exists, and how it relates.</text></svg>

-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Telecom domain</text><text data-id="cp-d54887" x="155.0" y="184.6" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">subscriber, order, device:</text><text data-id="cp-8548cd" x="155.0" y="207.6" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">entities, properties,</text><text data-id="cp-562a41" x="155.0" y="230.7" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">relationships</text><text data-id="cp-ce6a8c" x="420.0" y="178.0" font-size="24" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="start">Model the business once:</text><text data-id="cp-77e1e4" x="420.0" y="212.0" font-size="20" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">what exists, and how it relates.</text></svg>

<svg width="1120" height="400" class="fig" viewBox="0 0 1120 400" role="img" aria-label="Production topology: Oracle GoldenGate does the initial load and then every change from the MongoDB replica set&#x27;s oplog into Oracle AI Database 26ai. A reverse path, Oracle back to MongoDB, is labeled verify for your release. Two ways to run GoldenGate: GoldenGate for MongoDB Migrations, free-use terms with no support or patching, and licensed OCI GoldenGate, the supported path" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs><marker id="dkee07e09-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker><marker id="dkee07e09-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker><marker id="dkee07e09-varhot" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="18.0" y="36.0" width="300.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--flow)" stroke-width="1.4"/><rect x="18.0" y="36.0" width="4" height="104.0" rx="2" fill="var(--flow)"/><text x="170.0" y="71.1" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill=
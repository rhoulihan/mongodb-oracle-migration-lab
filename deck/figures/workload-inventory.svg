<svg width="1120" height="400" class="fig" viewBox="0 0 1120 400" role="img" aria-label="Workload inventory: subscribers, accounts, catalog and regions are entity data that lives for years, so they move. Orders age out under a retention policy. Order events (TTL 7 days) and carts (TTL 120 seconds) expire on their own and never need to move" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs><marker id="dk54d26011-varfaint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">DATA</text><text x="272.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">STAYS USEFUL FOR</text><text x="870.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">IN THE MIGRATION</text><rect x="18.0" y="64.0" width="4.0" height="40.0" rx="2" fill="var(--cool)" stroke="var(--cool)" stroke-width="0"/><text x="32.0" y="81.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">subscribers, accounts</text><text x="32.0" y="100.0" font-size="13" font-family="Public Sans, Segoe UI, sys
<svg width="1120" height="300" class="fig" viewBox="0 0 1120 300" role="img" aria-label="The on-ramp: the app keeps its code and MongoDB driver and changes only the connection string to the Oracle API for MongoDB. The destination: Oracle AI Database 26ai, one engine for JSON, SQL and the optimizer" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs><marker id="dk0c7e9d20-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker><marker id="dk0c7e9d20-varcool" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--cool)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="18.0" y="96.0" width="300.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="18.0" y="96.0" width="4" height="104.0" rx="2" fill="var(--ink)"/><text x="170.0" y="131.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Your app</text><text x="170.0" y="154.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same code,</text><text x="170.0" y="177.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same MongoDB driver</text><rect x="410.0" y="96.0" width="300.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--flow)" stroke-width="1.4"/><rect x="410.0" y="96.0" width="4" height="104.0" rx="2" fill="var(--flow)"/><text x="562.0" y="131.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Oracle API for MongoDB</text><text x="562.0" y="154.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">speaks the MongoDB</text><text x="562.0" y="177.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">wire protocol</text><rect x="802.0" y="96.0" width="300.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="802.0" y="96.0" width="4" height="104.0" rx="2" fill="var(--cool)"/><text x="954.0" y="131.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Oracle AI Database 26ai</text><text x="954.0" y="154.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">JSON, SQL and the optimizer</text><text x="954.0" y="177.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">in one engine</text><path d="M318.0,148.0 H364.0 H409.0" fill="none" stroke="var(--flow)" stroke-wid
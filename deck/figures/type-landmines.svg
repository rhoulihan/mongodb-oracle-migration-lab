<svg width="1120" height="384" class="fig" viewBox="0 0 1120 384" role="img" aria-label="BSON type landmines. A regex and a BSON Timestamp read back from Oracle as tagged objects, and $type queries on them are rejected. Decimal128 keeps its value and drops trailing zeros. On an array, $type does not match the elements" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs><marker id="dkdcae3627-varfaint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">ON MONGODB (BSON)</text><text x="378.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">READS BACK FROM ORACLE</text><text x="748.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">WHAT A QUERY SEES</text><rect x="18.0" y="50.0" width="320.0" height="52.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="378.0" y="50.0" width="330.0" height="52.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="748.0" y="50.0" width="354.0" height="52.0" rx="6" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="30.0" y="71.0" font-size="13" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">catalog.skuPattern · regex</text><text x="30.0" y="91.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">/^SKU-DEV-[0-9]{4}$/</text><text x="390.0" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--cool)" text-anchor="start">{&quot;$regularExpression&quot;: ...}</text><text x="760.0" y="82.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--hot)" text-anchor="start">{$type: &#x27;regex&#x27;} is rejected</text><line x1="344.0" y1="76.0" x2="372.0" y2="76.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#dkdcae3627-varfaint)"/><line x1="714.0" y1="76.0" x2="742.0" y2="76.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#dkdcae3627-varfaint)"/><rect x="18.0" y="110.0" width="320.0" height="52.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="378.0" y="110.0" width="330.0" height="52.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="748.0" y="110.0" width="354.0" height="52.0" rx="6" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="30.0" y="131.0" font-size="13" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">orderEvents.ts · Timestamp</text><text x="30.0" y="151.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">Timestamp(t, i)</text><text x
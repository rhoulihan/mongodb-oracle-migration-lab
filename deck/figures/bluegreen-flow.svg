<svg width="1120" height="420" class="fig" viewBox="0 0 1120 420" role="img" aria-label="Blue/green, sync live: the app writes to blue (MongoDB); after the initial load, every change replicates forward to green (Oracle) and the lag falls toward zero" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect data-id="bg-b6fb28" x="18.0" y="24.0" width="1084.0" height="64.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect data-id="bg-6a77ac" x="18.0" y="24.0" width="4" height="64.0" rx="2" fill="var(--ink)"/><text data-id="bg-ee0235" x="562.0" y="50.3" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Order service</text><text data-id="bg-63c363" x="562.0" y="74.6" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same code; only the connection string changes</text><rect data-id="bg-9989c4" x="18.0" y="230.0" width="400.0" height="116.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/><text data-id="bg-70cf3e" x="40.0" y="268.0" font-size="20" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="start">Blue: MongoDB</text><text data-id="bg-ad4c2a" x="40.0" y="300.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">live: takes every write</text><rect data-id="bg-b8446c" x="702.0" y="230.0" width="400.0" height="116.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.8"/><text data-id="bg-4414b2" x="724.0" y="268.0" font-size="20" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">Green: Oracle 26ai</text><text data-id="bg-6f888f" x="724.0" y="300.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">initial load, then changes</text><g data-id="bg-602201" class="overlay-twin"><rect data-id="bg-b44a9c" x="215.0" y="92.0" width="6.0" height="134.0" rx="3" fill="var(--flow)" stroke="var(--flow)" stroke-width="0"/></g><text data-id="bg-978372" x="234.0" y="168.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--flow)" text-anchor="start">connection string</text><g data-id="bg-602201-1" class="overlay-twin"><rect data-id="bg-de7063" x="444.0" y="283.0" width="232.0" height="6.0" rx="3" fill="var(--flow)" stroke="var(--flow)" stroke-width="0"/></g><g data-id="bg-602201-2" class="overlay-twin"><path data-id="bg-29265b" d="M676.0,275.0 L696.0,286.0 L676.0,297.0 Z" fill="var(--flow)" stroke="var(--flow)" stroke-width="0" stroke-linejoin="round"/></g><text data-id="bg-8fe867" x="560.0" y="264.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--flow)" text-anchor="middle">forward: every change</text><text data-id="bg-5a4923" x="560.0" y="322.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">lag: seconds, falling</text><line data-id="bg-73a4a7" x1="120.0" y1="388.0" x2="1000.0" y2="388.0" stroke="var(--hairline)" stroke-width="3"/><circle data-id="bg-dde127" cx="120.0" cy="388.0" r="7" fill="var(--ink)" stroke="none" stroke-width="0"/><text data-id="bg-b0797a" x="112.0" y="372.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Sync live</text><circle data-id="bg-195798" cx="560.0" cy="388.0" r="7" fill="var(--hairline)" stroke="none" stroke-width="0"/><text data-id="bg-8db587" x="560.0" y="372.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--faint)" text-anchor="middle">Cutover</text><circle data-id="bg-f074fd" cx="1000.0" cy="388.0" r="7" fill="var(--hairline)" stroke="none" stroke-width="0"/><text data-id="bg-5aa00d" x="1008.0" y="372.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--faint)" text-anchor="end">Fallback path</text><g data-id="bg-602201-3" class="overlay-twin"><circle data-id="bg-ee3b31" cx="120.0" cy="388.0" r="11.0" fill="none" stroke="var(--hot)" stroke-width="2.4"/></g></svg>

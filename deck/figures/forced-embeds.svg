<svg width="1120" height="380" class="fig" viewBox="0 0 1120 380" role="img" aria-label="Forced embeds: the app wants an order with its subscriber joined in. A MongoDB view can join it but is read only, so the order embeds a copy of the subscriber&#x27;s name, tier and address. One address change then rewrites every order that copied it. On Oracle a duality view is that joined shape and takes writes, with the subscriber stored once" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs><marker id="dk8651ac17-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker><marker id="dk8651ac17-varhot" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="18.0" y="36.0" width="300.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="18.0" y="36.0" width="4" height="104.0" rx="2" fill="var(--ink)"/><text x="170.0" y="71.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">The app wants</text><text x="170.0" y="94.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">an order with its</text><text x="170.0" y="117.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">subscriber joined in</text><rect x="410.0" y="36.0" width="300.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><rect x="410.0" y="36.0" width="4" height="104.0" rx="2" fill="var(--hot)"/><text x="562.0" y="71.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">A MongoDB view</text><text x="562.0" y="94.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">joins it, but read only:</text><text x="562.0" y="117.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">no writes through it</text><rect x="802.0" y="36.0" width="300.0" height="104.0" rx="6" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><rect x="802.0" y="36.0" width="4" height="104.0" rx="2" fill="var(--hot)"/><text x="954.0" y="71.1" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">So the order embeds</text><text x="954.0" y="94.1" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">a copy: name, tier,</text><text x="954.0" y="117.2" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">address in every order</text><path d="M318.0,88.0 H364.0 H409.0" fill="none" stroke="var(--flow)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dk8651ac17-varflow)"/><path d="M710.0,88.0 H756.0 H801.0" fill="none" stroke="var(--hot)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dk8651ac17-varhot)"/><text x="18.0" y="206.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="start">One address change</text><text x="18.0" y="232.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">rewrites every order that copied it</text><line x1="330.0" y1="210.0" x2="404.0" y2="210.0" stroke="var(--hot)" stroke-width="1.8" marker-end="url(#dk8651ac17-varhot)"/><rect x="420.0" y="176.0" width="50.0" height="68.0" rx="4" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><rect x="428.0" y="188.0" width="34.0" height="8.0" rx="2" fill="var(--chip)" stroke="var(--chip)" stroke-width="1"/><rect x="428.0" y="204.0" width="34.0" height="8.0" rx="2" fill="var(--chip)" stroke="var(--chip)" stroke-width="1"/><rect x="428.0" y="220.0" width="34.0" height="8.0" rx="2" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1"/><rect x="482.0" y="176.0" width="50.0" height="68.0" rx="4" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><rect x="490.0" y="188.0" width="34.0" height="8.0" rx="2" fill="var(--chip)" stroke="var(--chip)" stroke-width="1"/><rect x="490.0" y="204.0" width="34.0" height="8.0" rx="2" fill="var(--chip)" stroke="var(--chip)" stroke-width="1"/><rect x="490.0" y="220.0" width="34.0" height="8.0" rx="2" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1"/><rect x="544.0" y="176.0" width="50.0" height="68.0" rx="4" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.4"/><rect x="552.0" y
<svg width="1120" height="392" class="fig" viewBox="0 0 1120 392" role="img" aria-label="Where each model pays, measured in D5 on the laptop after the three dashboards were proven identical, relative only, ranges over the measured runs. Counter write per order: embedded 2,600 to 3,500 bytes of redo, the lookup pipeline nothing extra, converged 870 to 950 bytes. Dashboard read for one region: embedded 0.3 to 0.8 ms, the lookup pipeline 236 to 262 ms, converged 0.7 to 0.9 ms. A costlier read than one stored document, zero write amplification, and the optimizer plans the join" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="445.0" y="40.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="middle">(a) Embedded</text><text x="705.0" y="40.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="middle">(b) $lookup</text><text x="965.0" y="40.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="middle">(c) Converged</text><text x="18.0" y="98.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="start">Counter write</text><text x="18.0" y="122.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">redo per order, on top</text><text x="18.0" y="140.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">of the order itself</text><rect x="320.0" y="60.0" width="250.0" height="104.0" rx="8" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="445.0" y="110.0" font-size="30" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="middle">2.6 to 3.5 KB</text><text x="445.0" y="140.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">every order</text><rect x="580.0" y="60.0" width="250.0" height="104.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="705.0" y="110.0" font-size="30" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="middle">0 B</text><text x="705.0" y="140.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">nothing extra</text><rect x="840.0" y="60.0" width="250.0" height="104.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="965.0" y="110.0" font-size="30" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="middle">870 to 950 B</text><text x="965.0" y="140.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">one row, +1</text><text x="18.0" y="214.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="start">Dashboard read</text><text x="18.0" y="238.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">one region, median</text><text x="18.0" y="256.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">of 7, across runs</text><rect x="320.0" y="176.0" width="250.0" height="104.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="445.0" y="226.0" font-size="30" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="middle">0.3 to 0.8 ms</text><text x="445.0" y="256.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">usually fastest: one document</text><rect x="580.0" y="176.0" width="250.0" height="104.0" rx="8" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="705.0" y="226.0" font-size="30" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="middle">236 to 262 ms</text><text x="705.0" y="256.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">counts every order</text><rect x="840.0" y="176.0" width="250.0" height="104.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="965.0" y="226.0" font-size="30" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="middle">0.7 to 0.9 ms</text><text x="965.0" y="256.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">index scan and a join</text><rect x="18.0" y="300.0" width="1084.0" height="74.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="18.0" y="300.0" width="4" height="74.0" rx="2" fill="var(--cool)"/><text x="562.0" y="331.6" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">A costlier read than one stored document. Zero write amplification.</text><text x="562.0" y="354.6" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">The optimizer plans the join. Laptop, relative only, after the dashboards matched.</text></svg>

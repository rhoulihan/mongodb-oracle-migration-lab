<svg width="1120" height="300" class="fig" viewBox="0 0 1120 300" role="img" aria-label="Two common hybrids, a door per collection. One: dump and restore the entity collections (subscribers, accounts, catalog, regions) and age out the event collections (orders, order events, carts). Two: dump and restore everything now, with live sync for the one collection the business cannot freeze, here orders" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="40.0" font-size="20" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="start">1  Age out the events, dump and restore the entities</text><rect x="18.0" y="58.0" width="126.6" height="38.0" rx="19" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="81.3" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--hot)" text-anchor="middle">subscribers</text><rect x="154.6" y="58.0" width="99.2" height="38.0" rx="19" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="204.2" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--hot)" text-anchor="middle">accounts</text><rect x="263.8" y="58.0" width="90.0" height="38.0" rx="19" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="308.9" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--hot)" text-anchor="middle">catalog</text><rect x="363.9" y="58.0" width="90.0" height="38.0" rx="19" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="408.9" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--hot)" text-anchor="middle">regions</text><path d="M18,106 V114 H453.95 V106" fill="none" stroke="var(--hot)" stroke-width="1.6" stroke-linejoin="round"/><text x="236.0" y="136.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="middle">B  dump and restore</text><rect x="487.9" y="58.0" width="80.9" height="38.0" rx="19" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.4"/><text x="528.4" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--flow)" text-anchor="middle">orders</text><rect x="578.9" y="58.0" width="126.6" height="38.0" rx="19" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.4"/><text x="642.2" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--flow)" text-anchor="middle">orderEvents</text><rect x="715.5" y="58.0" width="71.8" height="38.0" rx="19" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.4"/><text x="751.4" y="82.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--flow)" text-anchor="middle">carts</text><path d="M487.95,106 V114 H787.25 V106" fill="none" stroke="var(--flow)" stroke-width="1.6" stroke-linejoin="round"/><text x="637.6" y="136.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--flow)" text-anchor="middle">A  age out</text><text x="18.0" y="180.0" font-size="20" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--ink)" text-anchor="start">2  Dump and restore now, live sync for the one you can&#x27;t
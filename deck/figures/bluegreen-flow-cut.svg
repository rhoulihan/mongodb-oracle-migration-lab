<svg width="1120" height="420" class="fig" viewBox="0 0 1120 420" role="img" aria-label="Blue/green, cutover: replication drains to lag zero and stops, and the app&#x27;s connection string flips from blue to green" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect data-id="bg-b6fb28" x="18.0" y="24.0" width="1084.0" height="64.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect data-id="bg-6a77ac" x="18.0" y="24.0" width="4" height="64.0" rx="2" fill="var(--ink)"/><text data-id="bg-1b09f1" x="562.0" y="50.3" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Order service</text><text data-id="bg-cb4ecb" x="562.0" y="74.6" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same code; only the connection string changes</text><rect data-id="bg-9989c4" x="18.0" y="230.0" width="400.0" height="116.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.8"/><text data-id="bg-07a883" x="40.0" y="268.0" font-size="20" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="start">Blue: MongoDB</text><text data-id="bg-40a95e" x="40.0" y="300.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">frozen: no new writes</text><rect data-id="bg-b8446c" x="702.0" y="230.0" width="400.0" height="116.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.8"/><text data-id="bg-fb67f3" x="724.0" y="268.0" font-size="20" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">Green: Oracle 26ai</text><text data-id="bg-718bbc" x="724.0" y="300.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">takes every write now</text><g data-id="bg-602201" class="overlay-twin"><rect data-id="bg-9876cb" x="899.0" y="92.0" width="6.0" height="134.0" rx="3" fill="var(--cool)" stroke="var(--cool)" stroke-width="0"/></g><text data-id="bg-dec019" x="886.0" y="168.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--cool)" text-anchor="end">connection string</text><g data-id="bg-602201-1" class="overlay-twin"><rect data-id="bg-22b1b0" x="444.0" y="283.0" width="232.0" height="6.0" rx="3" fill="var(--faint)" stroke="var(--faint)" stroke-width="0"/></g><text data-id="bg-23a2bf" x="560.0" y="264.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--faint)" text-anchor="middle">drain to lag 0, stop</text><text data-id="bg-67cfa3" x="560.0" y="322.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">the app flips</text><line data-id="bg-73a4a7" x1="120.0" y1="388.0" x2="1000.0" y2="388.0" stroke="var(--hairline)" stroke-width="3"/><circle data-id="bg-dde127" cx="120.0" cy="388.0" r="7" fill="var(--ink)" stroke="none" stroke-width="0"/><text data-id="bg-121dd0" x="112.0" y="372.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--faint)" text-anchor="start">Sync live</text><circle data-id="bg-d31473" cx="560.0" cy="388.0" r="7" fill="var(--ink)" stroke="none" stroke-width="0"/><text data-id="bg-2ea12a" x="560.0" y="372.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Cutover</text><circle data-id="bg-f074fd" cx="1000.0" cy="388.0" r="7" fill="var(--hairline)" stroke="none" stroke-width="0"/><text data-id="bg-20ce46" x="1008.0" y="372.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--faint)" text-anchor="end">Fallback path</text><g data-id="bg-602201-2" class="overlay-twin"><circle data-id="bg-14b422" cx="560.0" cy="388.0" r="11.0" fill="none" stroke="var(--hot)" stroke-width="2.4"/></g></svg>

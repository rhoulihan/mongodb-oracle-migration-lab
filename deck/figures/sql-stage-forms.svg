<svg width="1120" height="346" class="fig" viewBox="0 0 1120 346" role="img" aria-label="Three forms of the $sql stage. Opening stage: SQL starts the pipeline and later stages keep going. Mid-pipeline: the earlier stages&#x27; documents become a table named input. The only stage: DDL and DML are allowed, and named binds work only here" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="18.0" y="18.0" width="348.0" height="270.0" rx="8" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="18" y="18" width="4" height="270" rx="2" fill="var(--cool)"/><text x="40.0" y="56.0" font-size="20" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">1  Opening stage</text><text x="40.0" y="88.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">SQL starts the pipeline;</text><text x="40.0" y="110.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">later stages keep going</text><rect x="34.0" y="150.0" width="316.0" height="112.0" rx="6" fill="var(--chip)" stroke="var(--chip)" stroke-width="1"/><text x="46.0" y="184.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">db.aggregate([</text><text x="63.1" y="212.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">{$sql: &quot;SELECT ...&quot;},</text><text x="63.1" y="240.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">{$match: {...}} ])</text><rect x="385.0" y="18.0" width="348.0" height="270.0" rx="8" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="385" y="18" width="4" height="270" rx="2" fill="var(--cool)"/><text x="407.0" y="56.0" font-size="20" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">2  Mid-pipeline</text><text x="407.0" y="88.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">earlier stages feed SQL</text><text x="407.0" y="110.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">as a table named input</text><rect x="401.0" y="150.0" width="316.0" height="112.0" rx="6" fill="var(--chip)" stroke="var(--chip)" stroke-width="1"/><text x="413.0" y="184.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">db.orders.aggregate([</text><text x="430.1" y="212.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">{$match: {...}},</text><text x="430.1" y="240.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">{$sql: &quot;... FROM input&quot;} ])</text><rect x="752.0" y="18.0" width="348.0" height="270.0" rx="8" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="752" y="18" width="4" height="270" rx="2" fill="var(--cool)"/><text x="774.0" y="56.0" font-size="20" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">3  The only stage</text><text x="774.0" y="88.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">DDL and DML, and</text><text x="774.0" y="110.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">named binds</text><rect x="768.0" y="150.0" width="316.0" height="112.0" rx="6" fill="var(--chip)" stroke="var(--chip)" stroke-width="1"/><text x="780.0" y="184.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">db.aggregate([{$sql: {</text><text x="797.1" y="212.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">statement: &quot;...&quot;,</text><text x="797.1" y="240.0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">binds: {fromTs} }}])</text><text x="560.0" y="324.0" font-size="17" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">Inside $sql: no 100 MB stage memory cap, no 16 MiB cap on intermediate documents.</text></svg>

<svg width="1120" height="372" class="fig" viewBox="0 0 1120 372" role="img" aria-label="When to optimize, by door. Age out: remodel from day one because Oracle starts empty, $sql from day one, low added risk. Dump and restore: remodel after cutover in place, $sql from day one after cutover with no data move, no added risk because it is a separate project. Blue/green: remodel during the move behind a projection of blue&#x27;s shape, $sql on green during validation, medium added risk with two shapes to validate" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="431.0" y="38.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="middle">A  Age out</text><text x="701.0" y="38.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="middle">B  Dump/restore</text><text x="971.0" y="38.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="middle">C  Blue/green</text><text x="18.0" y="111.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Remodel the data</text><rect x="300.0" y="56.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="431.0" y="99.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">From day one:</text><text x="431.0" y="121.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">Oracle starts empty</text><rect x="570.0" y="56.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="701.0" y="99.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">After cutover,</text><text x="701.0" y="121.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">in place</text><rect x="840.0" y="56.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="971.0" y="99.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">During the move,</text><text x="971.0" y="121.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">behind blue&#x27;s shape</text><text x="18.0" y="215.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">$sql for hot pipelines</text><rect x="300.0" y="160.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="431.0" y="214.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">From day one</text><rect x="570.0" y="160.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="701.0" y="203.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">Day one after</text><text x="701.0" y="225.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">cutover; no data moves</text><rect x="840.0" y="160.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="971.0" y="203.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">On green,</text><text x="971.0" y="225.0" font-size="16" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">during validation</text><text x="18.0" y="319.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Risk it adds</text><rect x="300.0" y="288.0" width="262.0" height="48.0" rx="24.0" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="431.0" y="318.0" font-size="17" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="middle">Low</text><rect x="570.0" y="288.0" width="262.0" height="48.0" rx="24.0" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="701.0" y="318.0" font-size="17" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="middle">None: its own project</text><rect x="840.0" y="288.0" width="262.0" height="48.0" rx="24.0" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="971.0" y="318.0" font-size="17" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="middle">Medium: two shapes</text></svg>

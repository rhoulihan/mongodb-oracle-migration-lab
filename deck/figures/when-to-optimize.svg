<svg width="1120" height="372" class="fig" viewBox="0 0 1120 372" role="img" aria-label="When to optimize, by door. Age out: remodel from day one because Oracle starts empty, $sql from day one, low added risk. Dump and restore: remodel after cutover in place, $sql from day one after cutover with no data move, no added risk because it is a separate project. Blue/green: remodel during the move behind a projection of blue&#x27;s shape, $sql on green during validation, medium added risk with two shapes to validate" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="431.0" y="38.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="middle">A  Age out</text><text x="701.0" y="38.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="middle">B  Dump/restore</text><text x="971.0" y="38.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="middle">C  Blue/green</text><text x="18.0" y="111.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Remodel the data</text><rect x="300.0" y="56.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="431.0" y="99.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">From day one:</text><text x="431.0" y="121.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">Oracle starts empty</text><rect x="570.0" y="56.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="701.0" y="99.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">After cutover,</text><text x="701.0" y="121.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">in place</text><rect x="840.0" y="56.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="971.0" y="99.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">During the move,</text><text x="971.0" y="121.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">behind blue&#x27;s shape</text><text x="18.0" y="215.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">$sql for hot pipelines</text><rect x="300.0" y="160.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="431.0" y="214.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">From day one</text><rect x="570.0" y="160.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="701.0" y="203.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">Day one after</text><text x="701.0" y="225.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">cutover; no data moves</text><rect x="840.0" y="160.0" width="262.0" height="96.0" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="971.0" y="203.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--ink)" text-anchor="middle">On green,</text><text x="971.0" y="225.0" font-size="16" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">during validation</text><text x="18.0" y="319.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="start">Risk it adds</text><rect x="300.0" y="288.0" width="262.0" height="48.0" rx="24.0" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="431.0" y="318.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="middle">Low</text><rect x="570.0" y="288.0" width="262.0" height="48.0" rx="24.0" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="701.0" y="318.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="middle">None: its own project</text><rect x="840.0" y="288.0" width="262.0" height="48.0" rx="24.0" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="971.0" y="318.0" font-size="17" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="middle">Medium: two shapes</text></svg>

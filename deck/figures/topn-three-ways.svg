<svg width="1120" height="414" class="fig" viewBox="0 0 1120 414" role="img" aria-label="Top 10 devices per region, three ways. Embedded: every device&#x27;s count in one document per region, and one $inc rewrites the whole document; the read fetches it and the client sorts and keeps 10. $lookup pipeline: every order adds one to a counter document, and the read is a pipeline the app owns: sort, limit, $lookup the names. Converged: every order adds one to one counter row in the same transaction, and the app reads one document from a view; the SQL behind it, a pre-sorted index scan and a join, belongs to the database" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">THE MODEL</text><text x="300.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">WHAT EACH ORDER WRITES</text><text x="700.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">WHAT EACH DASHBOARD READ DOES</text><g class="fragment" data-fragment-index="1"><text x="18.0" y="86.0" font-size="19" font-family="Oracle Sans Tab, Oracle Sans, Public 
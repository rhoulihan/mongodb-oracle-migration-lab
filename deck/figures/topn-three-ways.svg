<svg width="1120" height="414" class="fig" viewBox="0 0 1120 414" role="img" aria-label="Top 10 devices per region, three ways. Embedded: every order rewrites the region&#x27;s whole Top-N document; the read is one document by key. $lookup pipeline: every order inserts only itself, and every dashboard read groups every order line in the region. Converged: every order adds one to one counter row in the same transaction, and the read takes 10 entries from a pre-sorted index, then joins the device names" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="18.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">THE MODEL</text><text x="300.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">WHAT EACH ORDER WRITES</text><text x="700.0" y="34.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">WHAT EACH DASHBOARD READ DOES</text><g class="fragment" data-fragment-index="1"><text x="18.0" y="86.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="start">(a) Embedded</text><text x="18.0" y="114.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">Top 10 stored in one</text>
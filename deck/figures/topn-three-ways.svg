)" text-anchor="start">whole 9.5 KB document</text><text x="412.0" y="140.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="start">pays on every write</text><rect x="700.0" y="52.0" width="402.0" height="108.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><rect x="716.0" y="64.0" width="60.0" height="84.0" rx="5" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.4"/><rect x="725.0" y="73.0" width="42.0" height="6.0" rx="2" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/><rect x="725.0" y="83.0" width="42.0" height="6.0" rx="2" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/><rect x="725.0" y="93.0" width="42.0" height="6.0" rx="2" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/><rect x="725.0" y="103.0" width="42.0" height="6.0" rx="2" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/><rect x="725.0" y="113.0" width="42.0" height="6.0" rx="2" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/><rect x="725.0" y="123.0" width="42.0" height="6.0" rx="2" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/><rect x="725.0" y="133.0" width="42.0" height="6.0" rx="2" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1"/><text x="812.0" y="84.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--ink)" text-anchor="start">reads every device;</text><text x="812.0" y="105.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--ink)" text-anchor="start">the client sorts</text><text x="812.0" y="140.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="start">one document, client sort</text>
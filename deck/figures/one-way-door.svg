<svg width="1120" height="332" class="fig" viewBox="0 0 1120 332" role="img" aria-label="The one-way door, delayed. During the window and a read-only soak on Oracle, MongoDB stays frozen, so going back is just pointing the app at MongoDB again. Once writes open on Oracle the door locks: going back means losing those writes or exporting them by hand. Decide in advance how much you would replay" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #053242; --glow: #1E4D59; --panel: #0A4153; --ink: #FFFFFF; --slate: #DCE7E6; --muted: #A9C3C4; --faint: #8FAAAC; --foot: #AEA8A2; --hairline: #2A5B6A; --chip: #0F4D61; --gold: #F0CC71; --hot: #E0705F; --hot-soft: rgba(224, 112, 95, 0.16); --cool: #8CC79E; --cool-soft: rgba(140, 199, 158, 0.16); --flow: #6FB8D3; --flow-soft: rgba(111, 184, 211, 0.16); --vec: #D99BB0; --vec-soft: rgba(217, 155, 176, 0.16); --graph: #F0CC71; --graph-soft: rgba(240, 204, 113, 0.15); --sans: "Oracle Sans Tab", "Oracle Sans", "Public Sans", "Segoe UI", system-ui, sans-serif; color-scheme: dark;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="22.0" y="166.0" width="354.0" height="76.0" rx="8" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.6"/><text x="40.0" y="198.0" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="start">The window</text><text x="40.0" y="224.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">dump, restore, validate</text><rect x="384.0" y="166.0" width="354.0" height="76.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.6"/><text x="402.0" y="198.0" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="start">Read-only soak</text><text x="402.0" y="224.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">Oracle serves reads; MongoDB frozen</text><rect x="746.0" y="166.0" width="352.0" height="76.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6"/><text x="764.0" y="198.0" font-size="18" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">Writes open on Oracle</text><text x="764.0" y="224.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">new data exists only here</text><path d="M714,154 V96.0 A28.0,28.0 0 0 1 770,96.0 V154 Z" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="759.0" cy="121.3" r="3.6" fill="var(--hot)" stroke="none" stroke-width="0"/><path d="M736.0,102.4 V97.4 A6,6 0 0 1 748.0,97.4 V102.4" fill="none" stroke="var(--hot)" stroke-width="2" stroke-linejoin="round"/><rect x="733.0" y="102.4" width="18.0" height="13.0" rx="2" fill="var(--hot)" stroke="var(--hot)" stroke-width="1"/><text x="784.0" y="120.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--hot)" text-anchor="start">the lock</text><path d="M22,62 V52 H698 V62" fill="none" stroke="var(--cool)" stroke-width="1.8" stroke-linejoin="round"/><text x="360.0" y="40.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="middle">Walk back: point the app at MongoDB. Nothing lost.</text><path d="M786,62 V52 H1098 V62" fill="none" stroke="var(--hot)" stroke-width="1.8" stroke-linejoin="round"/><text x="942.0" y="40.0" font-size="14" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="middle">Way back: lose writes or export them</text><path d="M384,254 V264 H738 V254" fill="none" stroke="var(--flow)" stroke-width="1.8" stroke-linejoin="round"/><text x="561.0" y="288.0" font-size="15" font-family="Oracle Sans Tab, Oracle Sans, Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--flow)" text-anchor="middle">the soak moves the lock later</text></svg>

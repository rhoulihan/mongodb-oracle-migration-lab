<svg width="1120" height="332" class="fig" viewBox="0 0 1120 332" role="img" aria-label="The one-way door, delayed. During the window and a read-only soak on Oracle, MongoDB stays frozen, so going back is just pointing the app at MongoDB again. Once writes open on Oracle the door locks: going back means losing those writes or exporting them by hand. Decide in advance how much you would replay" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="22.0" y="166.0" width="354.0" height="76.0" rx="8" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.6"/><text x="40.0" y="198.0" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="start">The window</text><text x="40.0" y="224.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">dump, restore, validate</text><rect x="384.0" y="166.0" width="354.0" height="76.0" rx="8" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="1.6"/><text x="402.0" y="198.0" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="start">Read-only soak</text><text x="402.0" y="224.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">Oracle serves reads; MongoDB frozen</text><rect x="746.0" y="166.0" width="352.0" height="76.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.6"/><text x="764.0" y="198.0" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--cool)" text-anchor="start">Writes open on Oracle</text><text x="764.0" y="224.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">new data exists only here</text><path d="M714,154 V96.0 A28.0,28.0 0 0 1 770,96.0 V154 Z" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="759.0" cy="121.3" r="3.6" fill="var(--hot)" stroke="none" stroke-width="0"/><path d="M736.0,102.4 V97.4 A6,6 0 0 1 748.0,97.4 V102.4" fill="none" stroke="var(--hot)" stroke-width="2" stroke-linejoin="round"/><rect x="733.0" y="102.4" width="18.0" height="13.0" rx="2" fill="var(--hot)" stroke="var(--hot)" stroke-width="1"/><text x="784.0" y="120.0" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--hot)" text-anchor="start">the lock</text><path d="M22,62 V52 H698 V62" fill="none" stroke="var(--cool)" stroke-width="1.8" stroke-linejoin="round"/><text x="360.0" y="40.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="middle">Walk back: point the app at MongoDB. Nothing lost.</text><path d="M786,62 V52 H1098 V62" fill="none" stroke="var(--hot)" stroke-width="1.8" stroke-linejoin="round"/><text x="942.0" y="40.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="middle">Way back: lose writes or export them</text><path d="M384,254 V264 H738 V254" fill="none" stroke="var(--flow)" stroke-width="1.8" stroke-linejoin="round"/><text x="561.0" y="288.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="700" fill="var(--flow)" text-anchor="middle">the soak moves the lock later</text></svg>

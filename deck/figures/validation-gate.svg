<svg width="1120" height="380" class="fig" viewBox="0 0 1120 380" role="img" aria-label="The validation gate: compare counts at the dump snapshot, run a $type differential per field on both sides, and replay the app&#x27;s own queries on both sides; only then flip the connection string. In this lab, catalog.skuPattern reads back the same on Oracle, but a $type regex query finds 300 documents on MongoDB and is rejected on Oracle" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs><marker id="dkca485517-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><rect x="18.0" y="40.0" width="236.0" height="112.0" rx="6" fill="var(--panel)" stroke="var(--flow)" stroke-width="1.4"/><rect x="18.0" y="40.0" width="4" height="112.0" rx="2" fill="var(--flow)"/><text x="138.0" y="79.1" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">1  Counts</text><text x="138.0" y="102.1" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">at the dump snapshot</text><text x="138.0" y="125.2" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">needed, not enough</text><rect x="300.0" y="40.0" width="236.0" height="112.0" rx="6" fill="var(--panel)" stroke="var(--flow)" stroke-width="1.4"/><rect x="300.0" y="40.0" width="4" height="112.0" rx="2" fill="var(--flow)"/><text x="420.0" y="79.1" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">2  $type check</text><text x="420.0" y="102.1" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">every field,</text><text x="420.0" y="125.2" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">both sides</text><rect x="582.0" y="40.0" width="236.0" height="112.0" rx="6" fill="var(--panel)" stroke="var(--flow)" stroke-width="1.4"/><rect x="582.0" y="40.0" width="4" height="112.0" rx="2" fill="var(--flow)"/><text x="702.0" y="79.1" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">3  App&#x27;s queries</text><text x="702.0" y="102.1" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same filters,</text><text x="702.0" y="125.2" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">same results?</text><rect x="864.0" y="40.0" width="238.0" height="112.0" rx="6" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.4"/><rect x="864.0" y="40.0" width="4" height="112.0" rx="2" fill="var(--cool)"/><text x="985.0" y="79.1" font-size="18" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Flip</text><text x="985.0" y="102.1" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">the connection</text><text x="985.0" y="125.2" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="middle">string</text><path d="M254.0,96.0 H277.0 H299.0" fill="none" stroke="var(--flow)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dkca485517-varflow)"/><path d="M536.0,96.0 H559.0 H581.0" fill="none" stroke="var(--flow)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dkca485517-varflow)"/><path d="M818.0,96.0 H841.0 H863.0" fill="none" stroke="var(--flow)" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#dkca485517-varflow)"/><text x="18.0" y="196.0" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" fill="var(--muted)" text-anchor="start">CAUGHT BY CHECK 2 IN THIS LAB</text><rect x="18.0" y="212.0" width="530.0" height="132.0" rx="8" fill="var(--cool-soft)" stroke="var(--cool)" stroke-width="1.4"/><text x="40.0" y="246.0" font-size="17" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--cool)" text-anchor="start">Read the document</text><text x="40.0" y="278.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">skuPattern: /^SKU-DEV-[0-9]{4}$/</text><text x="40.0" y="310.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">looks the same on both sides</text><rect x="572.0" y="212.0" width="530.0" height="132.0" rx="8" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="1.4"/><text x="594.0" y="246.0" font-size="17" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--hot)" text-anchor="start">Query by type</text><text x="594.0" y="278.0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--ink)" text-anchor="start">{skuPattern: {$type: &#x27;regex&#x27;}}</text><text x="594.0" y="310.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="600" fill="var(--hot)" text-anchor="start">MongoDB: 300 documents.  Oracle: rejected.</text></svg>

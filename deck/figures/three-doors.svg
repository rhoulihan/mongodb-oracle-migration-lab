<svg width="1120" height="412" class="fig" viewBox="0 0 1120 412" role="img" aria-label="Three migration strategies plotted on downtime and reversibility. Age out: near-zero downtime, slow, the old system becomes the archive. Dump and restore: planned downtime, fast, one-way once writes resume. Blue/green: near-zero downtime, reversible, the most moving parts" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper: #F6F8F9; --panel: #FFFFFF; --ink: #1C2733; --slate: #334155; --muted: #5A6B7C; --faint: #8B99A7; --hairline: #D8DEE4; --chip: #EDF1F4; --hot: #C74634; --hot-soft: rgba(199, 70, 52, 0.10); --cool: #16A34A; --cool-soft: rgba(22, 163, 74, 0.10); --flow: #2563EB; --flow-soft: rgba(37, 99, 235, 0.10); --vec: #7C3AED; --vec-soft: rgba(124, 58, 237, 0.10); --graph: #B45309; --graph-soft: rgba(180, 83, 9, 0.10); color-scheme: light;}</style><defs><marker id="dkb785967-varfaint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><line x1="168.0" y1="356.0" x2="1088.0" y2="356.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#dkb785967-varfaint)"/><line x1="168.0" y1="356.0" x2="168.0" y2="22.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#dkb785967-varfaint)"/><text x="152.0" y="42.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="end">walk back</text><text x="152.0" y="356.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="end">one-way</text><text x="152.0" y="201.0" font-size="16" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="end">Reversibility</text><text x="168.0" y="384.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">near zero</text><text x="1088.0" y="384.0" font-size="14" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="end">planned window</text><text x="628.0" y="384.0" font-size="16" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle">Downtime</text><g class="fragment" data-fragment-index="1"><path d="M398,250 V192.0 A28.0,28.0 0 0 1 454,192.0 V250 Z" fill="var(--flow-soft)" stroke="var(--flow)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="443.0" cy="217.3" r="3.6" fill="var(--flow)" stroke="none" stroke-width="0"/><text x="474.0" y="188.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--flow)" text-anchor="start">A  Age out</text><text x="474.0" y="214.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">near-zero downtime, slow</text><text x="474.0" y="235.0" font-size="15" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-weight="400" fill="var(--muted)" text-anchor="start">old system becomes the archive</text></g><g class="fragment" data-fragment-index="2"><path d="M728,336 V278.0 A28.0,28.0 0 0 1 784,278.0 V336 Z" fill="var(--hot-soft)" stroke="var(--hot)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="773.0" cy="303.3" r="3.6" fill="var(--hot)" stroke="none" stroke-width="0"/><path d="M750.0,284.4 V279.4 A6,6 0 0 1 762.0,279.4 V284.4" fill="none" stroke="var(--hot)" stroke-width="2" stroke-linejoin="round"/><rect x="747.0" y="284.4" width="18.0" height="13.0" rx="2" fill="var(--hot)" stroke="var(--hot)" stroke-width="1"/><text x="804.0" y="274.0" font-size="19" font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="800" fill="var(--hot)" text-anchor="start">B  Dump and restore</text><text 
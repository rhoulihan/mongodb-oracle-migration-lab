name: lab

# MongoDB to Oracle migration lab stack. Every host port binds to 127.0.0.1.
#   mongo       MongoDB 8.2 replica set rs0 (the migration source)
#   oracle      Oracle AI Database 26ai Free + ORDS + Oracle API for MongoDB (the target)
#   console     instructor web console (127.0.0.1:3200), on the app image
#   app         order service the demos drive (127.0.0.1:3300); its backend is
#               APP_MONGO_URI in .lab/app.env at start, switched live through
#               POST /admin/backend by `./lab.sh app-uri mongo|oracle`
#   runner      one-off demo / reset / generator container from the app image,
#               profile runner (`./lab.sh demo|reset dN|generate` use it)
#   replicator  D4 stand-in for Oracle GoldenGate, profile d4 (`./lab.sh repl fwd|rev|stop|status`)
services:
  mongo:
    build: ./docker/mongo
    image: mongodb-oracle-migration-lab-mongo:latest
    container_name: lab-mongo
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:27117:27017'
    healthcheck:
      # No spaces in the script: Podman's Docker-compatible API re-splits CMD healthchecks on whitespace.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.hello().isWritablePrimary?0:1)']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - mongo-data:/data/db
      - dumps:/dumps             # D3 mongodump archive, shared with the runner

  oracle:
    # Repo root as the build context (like app), so the image can carry the
    # demos' mongosh scripts (demos/d6-sql) under /opt/lab.
    build:
      context: .
      dockerfile: docker/oracle/Dockerfile
    image: mongodb-oracle-migration-lab-oracle:latest
    container_name: lab-oracle
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:1523:1521'    # SQL*Net
      - '127.0.0.1:8183:8181'    # ORDS / Database Actions
      - '127.0.0.1:27119:27017'  # Oracle API for MongoDB
    environment:
      ORACLE_PASSWORD: '${ORACLE_PASSWORD:-Sandbox2026}'   # SYS / SYSTEM
      APP_USER: 'MIG'
      APP_USER_PASSWORD: '${MIG_PASSWORD:-MigUser2026}'
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 180s
    # The image seeds oracle-data under the first container's SELinux label.
    # podman-compose recreates the container under a new random one, and
    # Oracle can't read its own files (ORA-01078 on boot); it also drops :Z
    # on named volumes. A fixed label keeps every recreation on the same one.
    security_opt:
      - label=level:s0:c100,c200
    volumes:
      - oracle-data:/opt/oracle/oradata

  # Instructor console (console/server.mjs) on the app image: one long-lived
  # process, so demos keep their state between steps. It never runs shell
  # commands; terminal steps are typed by the presenter and only checked here.
  # dumps: D3's archive (D5 and D6 setup restore it); state: D4 status files,
  # D7 agent state and the recorded rehearsal results (/state/recorded).
  console:
    image: mongodb-oracle-migration-lab-app:latest
    container_name: lab-console
    command: ['node', 'console/server.mjs']
    stop_grace_period: 20s
    ports:
      - '127.0.0.1:3200:3200'
    environment:
      LAB_IN_CONTAINER: '1'
      MIG_PASSWORD: '${MIG_PASSWORD:-MigUser2026}'
    volumes:
      - dumps:/dumps
      - state:/state

  # Order service, built into its own image (npm ci runs inside it, so the
  # host needs no Node). lab.sh writes .lab/app.env before any compose
  # command, so the file always exists.
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: mongodb-oracle-migration-lab-app:latest
    container_name: lab-app
    env_file: .lab/app.env
    environment:
      LAB_IN_CONTAINER: '1'
      MIG_PASSWORD: '${MIG_PASSWORD:-MigUser2026}'   # for the oracle target of /admin/backend
    ports:
      - '127.0.0.1:3300:3300'
    depends_on:
      mongo:
        condition: service_healthy

  # Demo runner (Ruling O): `compose run --rm --no-deps runner node ...`, a fresh
  # container per command, never started by `up`. Same image as app, so it has
  # the demo code, the MongoDB Database Tools and mongosh; it reaches the other
  # services over the compose network.
  runner:
    image: mongodb-oracle-migration-lab-app:latest
    profiles: ['runner']
    environment:
      LAB_IN_CONTAINER: '1'
      MIG_PASSWORD: '${MIG_PASSWORD:-MigUser2026}'
      D6_PIPELINE_RUNS: '${D6_PIPELINE_RUNS:-3}'   # D6: timed runs of the slow pipeline
    volumes:
      - dumps:/dumps
      - state:/state             # small state kept between one-off runs (D7 agents' memory)

  # D4 stand-in for Oracle GoldenGate (replicator/cli.mjs), profile d4, on the
  # app image. `./lab.sh repl fwd|rev` recreates it with REPL_MODE set;
  # `./lab.sh repl stop` sends SIGTERM, and it drains to lag 0 before exiting.
  # Its resume token and changelog position live in the state volume
  # (/state/d4), so a restarted container resumes where it stopped.
  replicator:
    image: mongodb-oracle-migration-lab-app:latest
    container_name: lab-replicator
    profiles: ['d4']
    command: ['node', 'replicator/cli.mjs', '${REPL_MODE:-status}']
    stop_grace_period: 30s
    environment:
      LAB_IN_CONTAINER: '1'
      MIG_PASSWORD: '${MIG_PASSWORD:-MigUser2026}'
    volumes:
      - state:/state

volumes:
  mongo-data:
  oracle-data:
  dumps:
  state:

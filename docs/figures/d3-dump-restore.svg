<svg xmlns="http://www.w3.org/2000/svg" width="960" height="384" viewBox="0 0 960 384" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36.0" font-size="18" fill="#C74634" font-weight="700">Demo 3: dump, restore, prove it</text>
<text x="24" y="58.0" font-size="12.5" fill="#5b6570">The standard tools, unchanged. Then prove the counts, the types, the app and the indexes.</text>
<rect x="36" y="84" width="260" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>

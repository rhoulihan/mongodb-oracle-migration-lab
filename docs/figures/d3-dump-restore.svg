<text x="710" y="281.0" font-size="13.5" fill="#1a1a1a" font-weight="700">The index came across</text>
<text x="680" y="304.0" font-size="11.5" fill="#5b6570">explain: INDEX RANGE SCAN</text>
<text x="680" y="320.7" font-size="11.5" fill="#5b6570">(MULTI VALUE) from the dump</text>
<text x="912" y="352.0" font-size="10.5" fill="#8a929b" text-anchor="end">terminal</text>

<circle cx="62" cy="106" r="11" fill="#C74634"/>
<text x="62" y="110.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="82" y="111.0" font-size="13.5" fill="#1a1a1a" font-weight="700">Dump the source</text>
<text x="52" y="134.0" font-size="11.5" fill="#5b6570">mongodump --archive --gzip:</text>
<text x="52" y="150.7" font-size="11.5" fill="#5b6570">8 collections in one file</text>
<text x="284" y="182.0" font-size="10.5" fill="#8a929b" text-anchor="end">terminal</text>
<rect x="350" y="84" width="260" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="350" y="84" width="5" height="110" rx="2" fill="#2563eb"/>
<circle cx="376" cy="106" r="11" fill="#C74634"/>
<text x="376" y="110.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="396" y="111.0" font-size="13.5" fill="#1a1a1a" font-weight="700">Restore as MIG</text>
<text x="366" y="134.0" font-size="11.5" fill="#5b6570">mongorestore into pre-created</text>
<text x="366" y="150.7" font-size="11.5" fill="#5b6570">collections; read the time aloud</text>
<text x="598" y="182.0" font-size="10.5" fill="#8a929b" text-anchor="end">terminal</text>
<rect x="664" y="84" width="260" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="664" y="84" width="5" height="110" rx="2" fill="#2563eb"/>
<circle cx="690" cy="106" r="11" fill="#C74634"/>
<text x="690" y="110.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="710" y="111.0" font-size="13.5" fill="#1a1a1a" font-weight="700">Counts match the dump</text>
<text x="680" y="134.0" font-size="11.5" fill="#5b6570">compared at the dump snapshot;</text>
<text x="680" y="150.7" font-size="11.5" fill="#5b6570">TTL keeps expiring on both sides</text>
<text x="912" y="182.0" font-size="10.5" fill="#8a929b" text-anchor="end">console</text>
<rect x="36" y="254" width="260" height="110" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
<rect x="36" y="254" width="5" height="110" rx="2" fill="#16a34a"/>
<circle cx="62" cy="276" r="11" fill="#C74634"/>
<text x="62" y="280.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="82" y="281.0" font-size="13.5" fill="#1a1a1a" font-weight="700">The $type differential</text>
<text x="52" y="304.0" font-size="11.5" fill="#5b6570">regex vs object, Int64 exact,</text>
<text x="52" y="320.7" font-size="11.5" fill="#5b6570">Decimal128 loses trailing zeros</text>
<text x="284" y="352.0" font-size="10.5" fill="#8a929b" text-anchor="end">console</text>
<rect x="350" y="254" width="260" height="110" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
<rect x="350" y="254" width="5" height="110" rx="2" fill="#16a34a"/>
<circle cx="376" cy="276" r="11" fill="#C74634"/>
<text x="376" y="280.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="396" y="281.0" font-size="13.5" fill="#1a1a1a" font-weight="700">Same app, now on Oracle</text>
<text x="366" y="304.0" font-size="11.5" fill="#5b6570">./lab.sh app-uri oracle, then</text>
<text x="366" y="320.7" font-size="11.5" fill="#5b6570">a smoke test, code unchanged</text>

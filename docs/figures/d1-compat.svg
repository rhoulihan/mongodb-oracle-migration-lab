<path d="M605,316 L674,316" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M286,476 L355,476" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M605,476 L674,476" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
</svg>
